name: Build, publish & Trivy scan image

on:
  push:
    branches: [ci-trivy-scan]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref of the code to build
        default: muse-cve-dependencies

jobs:
  build-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muse" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || 'muse-cve-dependencies' }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:muse-cve-dependencies
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}

      - name: Locate setuptools inside the image
        run: |
          docker run --rm --entrypoint sh "${IMAGE}:${GITHUB_SHA}" -c \
            'find / -xdev \( -iname "*setuptools*" -o -iname "pkg_resources" \) -not -path "/proc/*" 2>/dev/null | head -50'

      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy.sarif

      - name: Trivy scan (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln
          ignore-unfixed: true
          exit-code: '1'
