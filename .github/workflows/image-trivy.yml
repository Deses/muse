name: Build, publish & Trivy scan image

on:
  push:
    branches: [ci-trivy-scan]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref of the code to build
        default: muse-cve-dependencies

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/muse

jobs:
  build-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || 'muse-cve-dependencies' }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:muse-cve-dependencies
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}

      - name: Trivy scan (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy.sarif
